<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIC Transformer Live Showcase</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-blur"></div>
    <div class="app-container">
        <header>
            <div class="title-section">
                <h1>GIC <span>Transformer</span></h1>
                <p>Live 30-Minute Ground Magnetic Field (YKCX) Forecast</p>
            </div>
            <div class="controls">
                <button id="startBtn" class="btn primary">Start Live Simulation</button>
                <button id="pauseBtn" class="btn secondary" disabled>Pause</button>
            </div>
        </header>

        <main>
            <div class="glass-panel chart-container">
                <canvas id="predictionChart"></canvas>
            </div>
            
            <div class="stats-container">
                <div class="glass-panel stat-box">
                    <h3>Current True YKCX</h3>
                    <div class="value" id="valTrue">-- nT</div>
                </div>
                <div class="glass-panel stat-box highlight">
                    <h3>30-Min Forecast</h3>
                    <div class="value" id="valPred">-- nT</div>
                </div>
                <div class="glass-panel stat-box">
                    <h3>Delta</h3>
                    <div class="value" id="valDelta">-- nT</div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Data streamed from simulated December 2015 Geomagnetic Storm | Yellowknife Station (YKC)</p>
        </footer>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
