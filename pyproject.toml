[project]
name = "gictransformer"
version = "0.1.0"
description = "AI-Powered Geomagnetic Storm Intelligence and GIC Forecasting System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.2",
    "scipy>=1.7.3",
    "matplotlib>=3.5.1",
    "shap>=0.41.0",
    "pyyaml>=6.0",
    "requests>=2.27.1",
    "cdflib>=0.4.4",
    "tqdm>=4.64.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "ml"]

[dependency-groups]
dev = []
